version: 2

# AgentFlow dependency-update policy.
#
# Each ecosystem gets a weekly schedule, conventional-commit prefix that
# matches CONTRIBUTING.md, and a grouped minor+patch PR so the review
# queue does not get spammed. Major bumps stay individual.
#
# Dependabot version updates (the schedule below) are a different feature
# from Dependabot SECURITY updates. Security updates are a separate
# repo-level toggle. Gate 2 (2026-07-16) enabled both vulnerability alerts
# and automated security fixes on this repo:
#
#   gh api --method PUT repos/brownjuly2003-code/agentflow/vulnerability-alerts
#   gh api --method PUT repos/brownjuly2003-code/agentflow/automated-security-fixes
#
# Advisories now open a security-update PR immediately; the weekly schedule
# below still covers ordinary version bumps. This file cannot flip the
# toggle by itself — verify with:
#
#   gh api repos/brownjuly2003-code/agentflow --jq .security_and_analysis

updates:
  # ── Python: root runtime (agentflow-runtime) ───────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - python
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # langchain-core / langchain-text-splitters / langsmith / dagster
      # have explicit floors in pyproject.toml driven by CVE fixes
      # (see commit e8b1237 and the A06 dependency-profiles block).
      # Allow minor + patch within the >= floor, never major.
      #
      # NOTE (audit 2026-07-17 #8): a Dependabot `ignore` applies to BOTH
      # version updates AND security updates — there is no per-ignore
      # `applies-to` (that key exists only on `groups`). So a CVE fixed ONLY in
      # a major bump of these deps gets no automatic security-update PR. This is
      # an ACCEPTED tradeoff: the `safety` + `pip-audit` jobs in security.yml
      # scan these deps and FAIL on such a CVE, surfacing it for a deliberate
      # manual major bump (the whole reason their majors are gated). Do NOT
      # "fix" by dropping the ignore — that re-introduces the unwanted
      # major-version PR churn these floors exist to prevent.
      #
      # NOTE (2026-09-08): every condition below states an explicit version
      # range. `update-types: ["version-update:semver-major"]` looks equivalent
      # and is not: the update type is derived from the CURRENT version, and in
      # these pip ecosystems there is no current version to derive it from —
      # every requirement is a range and Dependabot has no pip lockfile to
      # resolve it against. The updater says so in as many words (root pip run
      # 34213488343): "Checking if mcp  needs updating", then "Ignored
      # versions:" with nothing after it, then "Updating mcp from  to 2.1.1".
      # All six conditions reached that job and all six ignored-version lists
      # came back empty, which is how PR #254 re-proposed #244's exact widening
      # hours after the mcp ignore landed. A version range needs no current
      # version, so it matches. Each ceiling mirrors the upper bound declared
      # in pyproject.toml / integrations/pyproject.toml;
      # tests/unit/test_dependabot_ignore_contract.py keeps the two in step.
      - dependency-name: "langchain-core"
        versions: [">=2"]
      - dependency-name: "langchain-text-splitters"
        versions: [">=2"]
      - dependency-name: "langsmith"
        versions: [">=1"]
      - dependency-name: "dagster"
        versions: [">=2"]
      # mcp 2.x's lowlevel Server drops the list_tools/call_tool decorators
      # integrations/agentflow_integrations/mcp/server.py is built on (checked
      # against 2.2.0), so a major bump is a port, not an update. PR #244
      # proposed <3 and was closed on that basis; the ignore stops it coming
      # back weekly. Same NOTE above applies: the safety/pip-audit jobs still
      # scan mcp and fail on a CVE that only a major fixes.
      - dependency-name: "mcp"
        versions: [">=2"]
      # pyiceberg-core is pinned to the release PyIceberg pairs with, not to
      # the newest one. PyIceberg 0.11.1 declares pyiceberg-core>=0.5.1,<0.9.0;
      # the only step up inside that window is 0.8.0, published as
      # requires-python <3.13, which the 3.11-3.13 resolution environments in
      # pyproject.toml rule out. Bumps only make sense when PyIceberg raises
      # its own range, and that arrives as a pyiceberg PR. PR #245 proposed
      # <0.11 and was closed on that basis.
      - dependency-name: "pyiceberg-core"
        versions: [">=0.8"]

  # ── Python: Flink runtime image manifest ───────────────────────────
  # Not an extra of the root project (its beam chain can never co-install
  # with core pyarrow>=17 — see the manifest header), so it needs its own
  # pip entry or new apache-flink releases go unnoticed. This is the
  # watchdog for the pyarrow safety-ignore (SFTY-20260217-93940 in
  # security.yml): the ignore is blocked on the next apache-flink release
  # raising the beam/pyarrow chain, and that release must open a PR here.
  # apache-flink majors/minors stay individual PRs by default (no group),
  # matching the deliberate-bump policy for the Flink line.
  - package-ecosystem: pip
    directory: "/src/agentflow_runtime/processing/flink_jobs"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps,flink)"
    labels:
      - dependencies
      - python
      - flink

  # ── Python: SDK (agentflow-client) ─────────────────────────────────
  - package-ecosystem: pip
    directory: "/sdk"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps,sdk)"
    labels:
      - dependencies
      - python
      - sdk

  # ── Python: integrations (agentflow-integrations) ──────────────────
  - package-ecosystem: pip
    directory: "/integrations"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps,integrations)"
    labels:
      - dependencies
      - python
      - integrations
    ignore:
      # The other half of the mirrored mcp pin (see the root pip entry): the
      # ceiling is what the integration's decorators need, so leaving this
      # ecosystem unignored just reopens the same PR from the other directory.
      # `versions:`, not `update-types:`, for the reason recorded in the root
      # pip entry: without a resolved current version an update-type condition
      # never matches.
      - dependency-name: "mcp"
        versions: [">=2"]

  # ── npm: TypeScript SDK ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/sdk-ts"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps,sdk-ts)"
    labels:
      - dependencies
      - javascript
      - sdk
    groups:
      sdk-ts-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ── Docker: all image bases (digest-pinned FROM lines) ─────────────
  # Covers every Dockerfile so the sha256 digest pins keep moving with
  # the upstream tags instead of going stale.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/src/agentflow_runtime/processing/flink_jobs"
      - "/docker/kafka-connect"
      - "/.devcontainer"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps,docker)"
    labels:
      - dependencies
      - docker
    ignore:
      # Container images track the CI-tested runtime line (python 3.11 in
      # every ci.yml job and all Dockerfiles; the flink image additionally
      # rides PyFlink/pemja support). Digest and patch updates flow; the
      # interpreter line moves only through a deliberate, validated bump
      # session (the Flink-2.2.1 precedent), not a Dependabot PR.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The production-CDC evidence path (Debezium 3.5 plugin, capture
      # script, kafka-get-offsets shape) is proven against cp-7.7.x; a
      # Kafka-platform major needs its own validated session.
      - dependency-name: "confluentinc/cp-kafka-connect-base"
        update-types:
          - "version-update:semver-major"

  # ── GitHub Actions: workflow pins ──────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps,ci)"
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # The operator-dispatched signing jobs (container-attestation.yml)
      # were validated end-to-end with cosign-installer v3; take the v4
      # major deliberately, paired with a real signing run.
      - dependency-name: "sigstore/cosign-installer"
        update-types:
          - "version-update:semver-major"

  # ── Terraform: infrastructure modules ──────────────────────────────
  # This ecosystem only works while `required_version` in
  # infrastructure/terraform/main.tf admits the Terraform version Dependabot's
  # updater image happens to ship: it runs `terraform init` and
  # `terraform providers lock` itself, and an unsatisfied core constraint kills
  # the run before it reads a single provider version. An exact `= 1.15.4` pin
  # did exactly that from 2026-09-08 -- the image was on 1.15.9 -- so the
  # constraint is pessimistic (`~> 1.15.4`). Keep it that way, or provider
  # updates, security ones included, silently stop arriving. The symptom is a
  # failed "terraform in /infrastructure/terraform" job under Dependabot
  # Updates reading `Unsupported Terraform Core version`; the fix is a
  # deliberate toolchain bump, not a wider constraint.
  - package-ecosystem: terraform
    directory: "/infrastructure/terraform"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps,terraform)"
    labels:
      - dependencies
      - terraform
