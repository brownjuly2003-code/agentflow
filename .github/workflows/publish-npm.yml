name: Publish TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish, without leading v"
        required: true
  push:
    tags:
      - "sdk-v*"
      - "v*-rc*"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Verify release tag matches SDK metadata
        env:
          MANUAL_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const tag = process.env.GITHUB_REF_NAME;
          if (process.env.GITHUB_REF_TYPE !== "tag") {
            throw new Error("npm publication must run from a release tag");
          }

          const tagMatch = tag?.match(/^(?:sdk-v|v)(\d+\.\d+\.\d+(?:-rc\d+)?)$/);
          if (!tagMatch) {
            throw new Error(`Unexpected tag format: ${tag ?? "<missing>"}`);
          }
          const expectedVersion = tagMatch[1];
          if (!expectedVersion) {
            throw new Error("Missing release version");
          }
          if (
            process.env.GITHUB_EVENT_NAME === "workflow_dispatch"
            && process.env.MANUAL_RELEASE_VERSION !== expectedVersion
          ) {
            throw new Error(
              `Manual release version ${process.env.MANUAL_RELEASE_VERSION} does not match tag ${expectedVersion}`,
            );
          }

          const expectedPythonVersion = expectedVersion.replace("-rc", "rc");
          const rootPyproject = fs.readFileSync("pyproject.toml", "utf8");
          const sdkPyproject = fs.readFileSync("sdk/pyproject.toml", "utf8");
          const sdkInit = fs.readFileSync("sdk/agentflow/__init__.py", "utf8");
          const packageJson = JSON.parse(fs.readFileSync("sdk-ts/package.json", "utf8"));
          const packageLock = JSON.parse(
            fs.readFileSync("sdk-ts/package-lock.json", "utf8"),
          );
          const rootMatch = rootPyproject.match(/^version = "([^"]+)"$/m);
          const sdkMatch = sdkPyproject.match(/^version = "([^"]+)"$/m);
          const sdkInitMatch = sdkInit.match(/^__version__ = "([^"]+)"$/m);
          const versionSurfaces = [
            ["pyproject.toml", rootMatch?.[1], expectedPythonVersion],
            ["sdk/pyproject.toml", sdkMatch?.[1], expectedPythonVersion],
            ["sdk/agentflow/__init__.py", sdkInitMatch?.[1], expectedPythonVersion],
            ["sdk-ts/package.json", packageJson.version, expectedVersion],
            ["sdk-ts/package-lock.json", packageLock.version, expectedVersion],
            [
              'sdk-ts/package-lock.json#packages[""]',
              packageLock.packages?.[""]?.version,
              expectedVersion,
            ],
          ];
          const mismatches = versionSurfaces
            .filter(([, actual, expected]) => actual !== expected)
            .map(([path, actual, expected]) => `${path} version ${actual ?? "<missing>"} does not match tag ${expected}`);
          if (mismatches.length) {
            throw new Error(mismatches.join("; "));
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${expectedVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PYTHON_RELEASE_VERSION=${expectedPythonVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `IS_RC=${String(expectedVersion.includes("-rc"))}\n`);
          NODE

      - name: Install dependencies
        working-directory: sdk-ts
        run: npm ci

      - name: npm audit (moderate)
        working-directory: sdk-ts
        run: npm audit --audit-level=moderate

      - name: Typecheck SDK
        working-directory: sdk-ts
        run: npm run typecheck

      - name: Test SDK
        working-directory: sdk-ts
        run: npm test

      - name: Build SDK
        working-directory: sdk-ts
        run: npm run build

      - name: Dry-run npm rc publish
        if: env.IS_RC == 'true'
        working-directory: sdk-ts
        run: npm publish --dry-run --access public --tag next

      - name: Dry-run npm production publish
        if: env.IS_RC != 'true'
        working-directory: sdk-ts
        run: npm publish --dry-run --access public

      - name: Skip npm upload for rc smoke
        if: env.IS_RC == 'true'
        working-directory: sdk-ts
        run: echo "RC smoke uses npm publish --dry-run only; no npm registry upload."

      - name: Publish to npm
        if: env.IS_RC != 'true'
        working-directory: sdk-ts
        run: npm publish --access public
