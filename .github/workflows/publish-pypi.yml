name: Publish Python Packages

on:
  push:
    tags:
      - "sdk-v*"
      - "v*-rc*"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    env:
      TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify release tag matches package metadata
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"(?:sdk-v|v)(\d+\.\d+\.\d+(?:-rc\d+)?)", tag)
          if match is None:
              raise SystemExit(f"Unexpected tag format: {tag}")

          release_version = match.group(1)
          python_version = release_version.replace("-rc", "rc", 1)
          root_pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          sdk_pyproject = tomllib.loads(Path("sdk/pyproject.toml").read_text(encoding="utf-8"))
          sdk_init = Path("sdk/agentflow/__init__.py").read_text(encoding="utf-8")
          sdk_init_match = re.search(r'^__version__ = "([^"]+)"$', sdk_init, re.MULTILINE)
          package_json = json.loads(Path("sdk-ts/package.json").read_text(encoding="utf-8"))
          package_lock = json.loads(
              Path("sdk-ts/package-lock.json").read_text(encoding="utf-8")
          )
          if sdk_init_match is None:
              raise SystemExit("Could not read sdk/agentflow/__init__.py version")

          version_surfaces = {
              "pyproject.toml": (root_pyproject["project"]["version"], python_version),
              "sdk/pyproject.toml": (sdk_pyproject["project"]["version"], python_version),
              "sdk/agentflow/__init__.py": (sdk_init_match.group(1), python_version),
              "sdk-ts/package.json": (package_json["version"], release_version),
              "sdk-ts/package-lock.json": (package_lock["version"], release_version),
              'sdk-ts/package-lock.json#packages[""]': (
                  package_lock["packages"][""]["version"],
                  release_version,
              ),
          }
          mismatches = [
              f"{path} version {actual} does not match tag {expected}"
              for path, (actual, expected) in version_surfaces.items()
              if actual != expected
          ]
          if mismatches:
              raise SystemExit("; ".join(mismatches))

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"RELEASE_VERSION={release_version}\n")
              env.write(f"PYTHON_RELEASE_VERSION={python_version}\n")
              env.write(f"IS_RC={str('-rc' in release_version).lower()}\n")
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade build==1.5.1 twine==6.2.0

      - name: Clean previous distributions
        run: rm -rf dist sdk/dist

      - name: Build Python distributions
        run: |
          python -m build .
          python -m build sdk/

      - name: Reject unsafe release artifacts
        run: python scripts/check_release_artifacts.py dist/* sdk/dist/*

      - name: Dry-run build and twine check
        run: python -m twine check dist/* sdk/dist/*

      - name: Publish rc packages to TestPyPI
        if: env.IS_RC == 'true' && env.TEST_PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/* sdk/dist/*

      - name: Skip TestPyPI upload without token
        if: env.IS_RC == 'true' && env.TEST_PYPI_API_TOKEN == ''
        run: echo "RC smoke completed with twine check only; TEST_PYPI_API_TOKEN is not configured."

      - name: Publish agentflow-runtime to PyPI (OIDC)
        if: env.IS_RC != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Publish agentflow-client SDK to PyPI (OIDC)
        if: env.IS_RC != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/dist/
          skip-existing: true
