[quality]
project_coverage_floor_percent = 60
patch_coverage_floor_percent = 80
critical_module_coverage_floor_percent = 90
strict_documentation_build = true

[sdk]
common_capabilities = [
    "entity reads",
    "metric reads",
    "query",
    "as_of historical reads",
    "cursor pagination",
    "per-call idempotency keys",
    "query explain",
    "search",
    "contracts",
    "lineage",
    "changelog",
    "health and freshness",
    "catalog",
    "batching",
    "retries",
    "circuit breaker",
]
python_only_capabilities = []
typescript_only_capabilities = ["event streaming", "AbortSignal cancellation"]
capability_contract_status = "verified-core-parity"

[[sdk.capability]]
name = "entity and historical reads"
python_methods = ["get_entity", "get_order", "get_user", "get_product", "get_session"]
typescript_methods = ["getEntity", "getOrder", "getUser", "getProduct", "getSession"]

[[sdk.capability]]
name = "metric and historical reads"
python_methods = ["get_metric"]
typescript_methods = ["getMetric"]

[[sdk.capability]]
name = "query, cursor, and pagination"
python_methods = ["query", "paginate"]
typescript_methods = ["query", "paginate"]

[[sdk.capability]]
name = "query explanation"
python_methods = ["explain_query"]
typescript_methods = ["explainQuery"]

[[sdk.capability]]
name = "semantic search"
python_methods = ["search"]
typescript_methods = ["search"]

[[sdk.capability]]
name = "contract lifecycle"
python_methods = ["list_contracts", "get_contract", "diff_contracts", "validate_contract"]
typescript_methods = ["listContracts", "getContract", "diffContracts", "validateContract"]

[[sdk.capability]]
name = "lineage and changelog"
python_methods = ["get_lineage", "get_changelog"]
typescript_methods = ["getLineage", "getChangelog"]

[[sdk.capability]]
name = "health, catalog, batch, and resilience"
python_methods = ["health", "is_fresh", "catalog", "batch", "configure_resilience"]
typescript_methods = ["health", "isFresh", "catalog", "batch", "configureResilience"]

