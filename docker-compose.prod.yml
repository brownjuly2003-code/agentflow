# PRODUCTION-SHAPED LOCAL DEMO -- not a production recipe (audit F-09).
#
# The filename says "prod" and the topology looks like one: three Kafka
# brokers, a schema registry, ClickHouse, Jaeger, Prometheus, Grafana. What it
# does NOT have is a production security posture -- plaintext Kafka, Redis and
# ClickHouse on loopback, dev credentials, no TLS anywhere -- and the API runs
# in demo mode, which the runtime refuses to combine with
# AGENTFLOW_PROFILE=production. That refusal is deliberate: this stack cannot
# be relabelled into a production one by flipping an environment variable.
#
# The production path is Helm: helm/agentflow with
# helm/agentflow/values-production.yaml layered under your environment values.
# See docs/deployment.md.
#
# The project name below keeps this stack's containers and volumes apart from
# the dev docker-compose.yml stack, which used to share them through the
# directory-derived default name.
name: agentflow-prod-shaped-local

# Bounded container logs: the 2026-07-18 soak filled the stand's disk with
# unrotated json-file logs (TM alone grew to 3.8G) and took the pipeline down.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  kafka-1:
    logging: *default-logging
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka-1
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      CLUSTER_ID: "AgentFlowKafkaProdCluster01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-2:
    logging: *default-logging
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka-2
    ports:
      - "127.0.0.1:29092:19092"
    environment:
      CLUSTER_ID: "AgentFlowKafkaProdCluster01"
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-3:
    logging: *default-logging
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka-3
    ports:
      - "127.0.0.1:39092:19092"
    environment:
      CLUSTER_ID: "AgentFlowKafkaProdCluster01"
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    logging: *default-logging
    image: confluentinc/cp-schema-registry:7.7.0
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    logging: *default-logging
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      schema-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: agentflow-prod
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  redis:
    logging: *default-logging
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    logging: *default-logging
    image: jaegertracing/all-in-one:1.55
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  clickhouse:
    logging: *default-logging
    # Part of the default bring-up since ADR 0006 fixed the serving engine on
    # ClickHouse (no longer profile-gated).
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: agentflow
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q 'Ok.'"]
      interval: 10s
      timeout: 10s
      retries: 10

  serving-init:
    logging: *default-logging
    # Provisioning ran on API boot until audit P0-2: the serving identity then
    # needed CREATE/ALTER/INSERT, several booting replicas could race on the
    # same seed, and an empty production store got demo rows just for being
    # empty. It is a one-shot job now — the Compose counterpart of the Helm
    # pre-install migration hook.
    #
    # This stack is a production-SHAPED local demo, so it also passes --seed and
    # the documented demo entities exist. A real deployment runs --schema alone.
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      AGENTFLOW_SERVING_CONFIG: /app/config/serving.yaml
      DUCKDB_PATH: /app/data/agentflow_api.duckdb
      SERVING_BACKEND: ${SERVING_BACKEND:-clickhouse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: agentflow
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    command: ["python", "-m", "agentflow_runtime.serving.provision", "--schema", "--seed"]
    restart: "no"
    volumes:
      - agentflow-api-data:/app/data
      - ./config:/app/config:ro

  agentflow-api:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      serving-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      AGENTFLOW_SERVING_CONFIG: /app/config/serving.yaml
      DUCKDB_PATH: /app/data/agentflow_api.duckdb
      SERVING_BACKEND: ${SERVING_BACKEND:-clickhouse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: agentflow
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: agentflow-api
      REDIS_URL: redis://redis:6379/0
      # Explicit local auth contract (audit F-09). This stack used to pass no
      # auth settings at all: the middleware then fail-closed every /v1 route
      # with 503, and the only thing anyone ever smoked was /health/ready. The
      # keys file is the real loader path; demo mode adds the published demo
      # key so an authenticated request is actually possible. Demo mode is also
      # what makes this stack structurally unable to claim production -- the
      # runtime refuses AGENTFLOW_DEMO_MODE=true together with
      # AGENTFLOW_PROFILE=production.
      AGENTFLOW_API_KEYS_FILE: /app/config/api_keys.yaml
      AGENTFLOW_DEMO_MODE: "true"
      DEMO_API_KEY: ${DEMO_API_KEY:-demo-key}
    command: ["uvicorn", "agentflow_runtime.serving.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - agentflow-api-data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      # /v1/health always answers 200 — its status is in the payload — so this
      # check reported "healthy" for a container whose serving store was dead
      # (audit P0-3). /health/ready answers 503 instead, and urlopen raises.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health/ready")
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v2.54.0
    depends_on:
      agentflow-api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"
    # The config used to be a heredoc written by the entrypoint: untracked,
    # unreviewable and scrape-only, so the alert rules this repository
    # maintains never loaded here (audit F-09). Both files are tracked and
    # mounted read-only now.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.prod-shaped-local.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus

  # Alerting had a notification path on paper only: rules existed, nothing
  # evaluated them and nothing received them. This Alertmanager closes the loop
  # locally -- it groups and holds alerts so an operator can see them at :9093.
  # It notifies nobody, and its config says so.
  alertmanager:
    logging: *default-logging
    image: prom/alertmanager:v0.27.0
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alerting/alertmanager.prod-shaped-local.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  grafana:
    logging: *default-logging
    image: grafana/grafana:11.2.0
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline_health.json
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  redis-data:
  clickhouse-data:
  agentflow-api-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
