bootstrap.servers=${env:CONNECT_BOOTSTRAP_SERVERS}
rest.advertised.host.name=${env:CONNECT_REST_ADVERTISED_HOST_NAME}
rest.port=${env:CONNECT_REST_PORT}
group.id=${env:CONNECT_GROUP_ID}
config.storage.topic=${env:CONNECT_CONFIG_STORAGE_TOPIC}
offset.storage.topic=${env:CONNECT_OFFSET_STORAGE_TOPIC}
status.storage.topic=${env:CONNECT_STATUS_STORAGE_TOPIC}
config.storage.replication.factor=${env:CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR}
offset.storage.replication.factor=${env:CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR}
status.storage.replication.factor=${env:CONNECT_STATUS_STORAGE_REPLICATION_FACTOR}
key.converter=${env:CONNECT_KEY_CONVERTER}
value.converter=${env:CONNECT_VALUE_CONVERTER}
key.converter.schemas.enable=${env:CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE}
value.converter.schemas.enable=${env:CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE}
plugin.path=/usr/share/java/debezium
offset.flush.interval.ms=${env:CONNECT_OFFSET_FLUSH_INTERVAL_MS}
config.providers=env,file
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
config.providers.env.param.allowlist.pattern=^CONNECT_.*
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
config.providers.file.param.allowed.paths=/opt/connect/secrets
