{{- if and .Values.flinkJob.enabled .Values.flinkJob.createRbac }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentflow.fullname" . }}-flink
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - pods
      - pods/log
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Flink Kubernetes Operator 1.15 JobManager reconcile (proven on kind acceptance)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/finalizers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentflow.fullname" . }}-flink
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentflow.fullname" . }}-flink
subjects:
  - kind: ServiceAccount
    name: {{ include "agentflow.flinkServiceAccountName" . }}
{{- end }}
