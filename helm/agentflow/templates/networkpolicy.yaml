{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentflow.fullname" . }}
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentflow.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          - analytics-retention
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networkPolicy.ingressFromNamespaces }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    # DNS — required for any service-name resolution.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Redis (rate limiting + cache).
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.redis }}
    # Kafka brokers.
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.kafka }}
    {{- if .Values.lakeMaterializer.enabled }}
    # Iceberg REST catalog and S3-compatible object store.
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.icebergCatalog }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.objectStore }}
    {{- end }}
    # ClickHouse HTTP backend (when SERVING_BACKEND=clickhouse).
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.clickhouse }}
    # OTLP gRPC collector (when OTEL_EXPORTER_OTLP_ENDPOINT set).
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.otlp }}
    {{- if eq .Values.controlPlane.store "postgres" }}
    # PostgreSQL control-plane store (when controlPlane.store=postgres): the
    # shared webhook/alert/outbox/usage pool. Without this rule every API and
    # worker pod's connect to PG:5432 is denied and the pool never opens.
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.postgres }}
    {{- end }}
{{- end }}
{{ if and .Values.networkPolicy.enabled .Values.analyticsRetention.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentflow.fullname" . }}-analytics-retention-egress
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-retention
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS is required before the API Service name can be resolved.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentflow.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentflow.fullname" . }}-analytics-retention-api-ingress
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentflow.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: analytics-retention
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{ end }}
