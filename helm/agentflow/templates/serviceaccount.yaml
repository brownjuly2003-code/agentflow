{{- if .Values.serviceAccount.create }}
{{- if .Values.serviceAccount.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentflow.provisionServiceAccountName" . }}
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
  annotations:
    # The provision Job is a pre-install/pre-upgrade hook (weight -5). Helm
    # applies hook resources before regular release resources, so a normal SA
    # does not exist when that Job starts — first install hangs in
    # pending-install until the SA is created out-of-band (live E4 stand,
    # 2026-07-16). Own the SA as an earlier pre-install hook so first install
    # is self-contained. Do NOT include pre-upgrade: before-hook-creation
    # would delete/recreate the SA on every upgrade, invalidating projected
    # tokens already mounted by running pods (live upgrade rev4, Flink JM
    # 401 on core ConfigMaps until JM restart).
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
    # Do not use hook-succeeded: Deployment/worker pods keep using this SA
    # after hooks finish. before-hook-creation only matters for pre-install
    # retry (failed install re-run), not upgrade.
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- else }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentflow.apiServiceAccountName" . }}
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # The worker identity is also used by serving-bridge and lake-materializer;
  # none of those workloads needs Kubernetes API access.
  name: {{ include "agentflow.workerServiceAccountName" . }}
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentflow.provisionServiceAccountName" . }}
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
  annotations:
    # The provision Job is a pre-install/pre-upgrade hook (weight -5). Helm
    # applies hook resources before regular release resources, so this account
    # must remain an earlier pre-install-only hook. Do NOT add pre-upgrade:
    # recreating an account used by a running pod invalidates projected tokens.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentflow.flinkServiceAccountName" . }}
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
