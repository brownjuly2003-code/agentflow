[project]
name = "agentflow-integrations"
# Not in the release lockstep, and not by accident (audit FB-05).
# `scripts/release.py` bumps the runtime, the Python SDK and the TS SDK
# together; this package is not published to any index and is not in that set,
# so its version moves only when this package changes. What has to stay true is
# the dependency range below, which is what `tests/unit/test_release_version_
# coherence.py` pins: it must admit the client version the lockstep currently
# ships. Reading 2.0.0 next to the runtime's 2.1.0 is expected, not drift.
version = "2.0.0"
description = "LangChain, LlamaIndex, CrewAI, and MCP integrations for AgentFlow"
requires-python = ">=3.11"
dependencies = [
    # Integrations 2.x tracks the supported client major. A future breaking
    # client release must not satisfy this range and produce an incompatible pair.
    "agentflow-client>=2,<3",
    # See agentflow-runtime pyproject.toml for vulnerability rationale on
    # langchain-core / langchain-text-splitters / langsmith floors.
    "langchain>=0.3.30,<2",
    "langchain-core>=1.2.22,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "langsmith>=0.7.31,<1",
    "llama-index-core>=0.12,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
mcp = [
    # mcp 2.x's lowlevel Server drops the list_tools/call_tool decorators
    # server.py is built on (checked against 2.2.0). Port the module before
    # moving this pin; the root pyproject mirrors it.
    "mcp>=1.0,<2",
]

[project.scripts]
agentflow-mcp = "agentflow_integrations.mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentflow_integrations"]
