# Prometheus configuration for the production-SHAPED LOCAL stack
# (docker-compose.prod.yml). Tracked and mounted read-only, because the
# previous version of this config was a heredoc the compose entrypoint wrote at
# start-up: nothing reviewed it, and it carried scrape targets only, so the
# alert rules this repository maintains were never evaluated here (audit F-09).
#
# Not to be confused with monitoring/prometheus/prometheus.yml, which serves
# the dev docker-compose.yml stack and scrapes Flink, Kafka and the freshness
# monitor over host.docker.internal. This file scrapes the services that
# actually exist in the prod-shaped stack, by their compose service names.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "agentflow-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["agentflow-api:8000"]

# Honest scope note. monitoring/alerting/rules.yml is written for the full
# pipeline, so in this stack only the rules whose series the API itself exports
# can ever fire. The pipeline-side rules (freshness SLA, pipeline latency,
# Flink and Kafka health) stay loaded and stay at "no data" here, because
# nothing in this stack produces those series. That is a property of the stack,
# not a broken rule set -- do not "fix" it by deleting the rules.
