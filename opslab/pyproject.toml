[project]
name = "agentflow-opslab"
version = "0.1.0"
description = "Transport-neutral benchmark contracts for operational AI agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow_opslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "../.tmp/opslab-pytest-cache"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "../.tmp/opslab-ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
cache_dir = "../.tmp/opslab-mypy-cache"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
