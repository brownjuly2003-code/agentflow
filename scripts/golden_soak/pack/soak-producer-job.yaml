apiVersion: batch/v1
kind: Job
metadata:
  name: agentflow-golden-4h-producer-20260819-07
  namespace: agentflow
  labels:
    app.kubernetes.io/name: agentflow
    app.kubernetes.io/component: golden-4h-producer
    app.kubernetes.io/instance: golden-4h-soak-rv-20260819-07
    agentflow.dev/task-id: golden-4h-soak-rv-20260819-07
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 15000
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentflow
        app.kubernetes.io/component: golden-4h-producer
        app.kubernetes.io/instance: golden-4h-soak-rv-20260819-07
        agentflow.dev/task-id: golden-4h-soak-rv-20260819-07
    spec:
      restartPolicy: Never
      serviceAccountName: agentflow-soak-rv
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-evidence
          image: agentflow/api:ed03fc47-iceberg-live-20260801-01
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - mkdir -p /evidence && chown -R 10001:10001 /evidence
          volumeMounts:
            - name: evidence
              mountPath: /evidence
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: producer
          image: agentflow/api:ed03fc47-iceberg-live-20260801-01
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          env:
            - name: RUN_LABEL
              value: golden-4h-soak-rv-20260819-07
            - name: SOURCE
              value: golden-4h-soak-rv-20260819-07
            - name: EVENT_PREFIX
              value: "f8b2c3d4-e5f6-4a71-b829-"
            - name: ORDER_PREFIX
              value: ORD-20260819-0700
            - name: COUNT
              value: "1440000"
            - name: RATE_EPS
              value: "100"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.agentflow.svc.cluster.local:9092
            - name: EVIDENCE_DIR
              value: /evidence
          command:
            - python
            - /scripts/producer.py
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: evidence
              mountPath: /evidence
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: agentflow-golden-4h-soak-control-20260819-07
            defaultMode: 0444
        - name: evidence
          hostPath:
            path: /var/agentflow-task-state/golden-4h-soak-rv-20260819-07
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
